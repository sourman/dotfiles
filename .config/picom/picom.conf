# picom — low-CPU profile (GLX + damage; no shadows/fades/dim).
# xfwm4: keep general/use_compositing=false

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# Shadows are the main xrender CPU killer — off
shadow = false;

# Rounded corners only (no per-frame detect-rounded-corners scan)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Plank'"
];

fading = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = false;
use-ewmh-active-win = true;
